
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - GharCare</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
</head>

<body class="bg-black text-white min-h-screen">

    <!-- Top Navbar -->
    <nav class="bg-zinc-900 border-b border-white/10 py-4 px-6 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <img src="{% static 'assets/GharCare.png' %}" class="w-10 h-10 rounded-full">
            <h1 class="text-2xl font-bold">GharCare <span class="text-cyan-400">Admin</span></h1>
        </div>
        <div>
            <a href="{% url 'home' %}" class="px-5 py-2 bg-white/10 hover:bg-white/20 rounded-xl transition">← Back to Home</a>
            <a href="{% url 'logout' %}" class="ml-3 px-5 py-2 bg-red-600 hover:bg-red-700 rounded-xl transition">Logout</a>
        </div>
    </nav>

    <div class="flex">

        <!-- Sidebar -->
        <div class="w-64 bg-zinc-900 h-screen p-6 border-r border-white/10">
            <h3 class="text-gray-400 uppercase text-xs tracking-widest mb-4">Management</h3>
            <ul class="space-y-2">
                <li>
                    <a href="{% url 'admin_dashboard' %}"
                    class="block py-3 px-4 rounded-2xl
                    {% if request.path == '/admins/admin-dashboard/' %}
                    bg-cyan-500/10 text-cyan-400
                    {% else %}
                    hover:bg-white/5
                    {% endif %}">
                        Bookings
                    </a>
                </li>

                <li>
                    <a href="{% url 'service_providers' %}"
                    class="block py-3 px-4 rounded-2xl
                    {% if request.path == '/admins/providers/' %}
                    bg-cyan-500/10 text-cyan-400
                    {% else %}
                    hover:bg-white/5
                    {% endif %}">
                        Service Providers
                    </a>
                </li>

                <li>
                    <a href="{% url 'provider_requests' %}"
                    class="block py-3 px-4 rounded-2xl
                    {% if request.path == '/admins/provider-requests/' %}
                    bg-cyan-500/10 text-cyan-400
                    {% else %}
                    hover:bg-white/5
                    {% endif %}">
                        Provider Requests
                    </a>
                </li>

                <li>
                    <a href="{% url 'users_list' %}"
                    class="block py-3 px-4 rounded-2xl
                    {% if request.path == '/admins/users/' %}
                    bg-cyan-500/10 text-cyan-400
                    {% else %}
                    hover:bg-white/5
                    {% endif %}">
                       Users
                    </a>
                </li>

                <li>
                    <a href="{% url 'services_list' %}"
                    class="block py-3 px-4 rounded-2xl
                    {% if request.path == '/admins/services/' %}
                    bg-cyan-500/10 text-cyan-400
                    {% else %}
                    hover:bg-white/5
                    {% endif %}">
                        Services
                    </a>
                </li>

            </ul>
        </div>

        {% block content %}
        {% endblock content %}

    </div>

</body>
</html>
