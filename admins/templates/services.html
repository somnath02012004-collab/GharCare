{% extends "base.html" %}

{% load static %}

{% block content %}

<div class="flex-1 p-8">
<div class="flex justify-between items-center mb-8">

    <h1 class="text-4xl font-bold">
        All Services
    </h1>

    <span class="px-4 py-2 rounded-xl bg-cyan-500/10 text-cyan-400">
        Total Services: {{ services.count }}
    </span>

</div>

<div class="grid md:grid-cols-3 gap-6">

    {% for service in services %}

    <div class="bg-zinc-900 border border-white/10 rounded-3xl p-6 hover:border-cyan-500 transition">

        <h2 class="text-2xl font-bold text-cyan-400">
            {{ service.name }}
        </h2>

        <p class="mt-4 text-gray-300">
            {{ service.description }}
        </p>

    </div>

    {% empty %}

    <div class="col-span-3 text-center py-10 text-gray-400">
        No Services Found
    </div>

    {% endfor %}

</div>

</div>

{% endblock content %}
