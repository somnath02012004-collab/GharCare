{% load static %}
<html lang="en">

<head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title> GharCare </title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="{% static 'css/home.css' %}">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>
<body
    class="font-[Poppins] overflow-x-hidden text-white scroll-smooth bg-[linear-gradient(135deg,#050505,#1a0715,#000000)] relative">

    <!-- Glow Background -->
    <div
        class="absolute top-0 left-0 w-[500px] h-[500px] bg-orange-500/20 rounded-full blur-3xl">
    </div>
    <div
        class="absolute bottom-0 right-0 w-[500px] h-[500px] bg-pink-500/20 rounded-full blur-3xl">
    </div>
    {% if not hide_navbar %}
        {% include 'navbar.html' %}
    {% endif %}

    {% block content %}
    {% endblock %}

    {% if not hide_navbar %}
        {% include 'footer.html' %}
    {% endif %}
</body>
</html>
